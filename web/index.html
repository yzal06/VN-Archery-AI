<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Archery AI - YOLO Pose Web (ONNX)</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      gap: 12px;
    }
    header {
      width: 100%;
      max-width: 720px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    h1 { font-size: 1.1rem; font-weight: 700; }
    .status { font-size: 0.85rem; color: var(--accent); }
    .controls {
      width: 100%;
      max-width: 720px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button, select {
      background: var(--card);
      color: var(--text);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button.primary { background: #0284c7; border-color: #0284c7; font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .stage {
      position: relative;
      width: 100%;
      max-width: 720px;
      background: #020617;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      aspect-ratio: 4 / 3;
    }
    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    video { opacity: 0; pointer-events: none; }
    .metrics {
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 8px;
    }
    .card {
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .card .label { font-size: 0.75rem; color: var(--muted); }
    .card .val { font-size: 1.15rem; font-weight: 700; margin-top: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>Archery AI · YOLO11-Pose (ONNX)</h1>
    <div id="status" class="status">Đang tải model ONNX...</div>
  </header>

  <div class="controls">
    <button id="toggleCamBtn" class="primary" disabled>Bật Camera</button>
    <select id="facingSelect">
      <option value="environment">Camera sau</option>
      <option value="user">Camera trước</option>
    </select>
    <select id="bowSideSelect">
      <option value="left">Cầm cung tay trái</option>
      <option value="right">Cầm cung tay phải</option>
    </select>
  </div>

  <div class="stage">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="metrics">
    <div class="card"><div class="label">Pha (Phase)</div><div id="mPhase" class="val">—</div></div>
    <div class="card"><div class="label">Dáng đứng (Tư thế)</div><div id="mPosture" class="val">—</div></div>
    <div class="card"><div class="label">Độ rộng chân / vai</div><div id="mStance" class="val">—</div></div>
    <div class="card"><div class="label">Nghiêng thân</div><div id="mLean" class="val">—</div></div>
    <div class="card"><div class="label">Khuỷu tay cầm cung</div><div id="mBow" class="val">—</div></div>
    <div class="card"><div class="label">Khuỷu tay kéo dây</div><div id="mDraw" class="val">—</div></div>
    <div class="card"><div class="label">Độ lệch vai</div><div id="mTilt" class="val">—</div></div>
    <div class="card"><div class="label">Độ rung tay (Std)</div><div id="mTremor" class="val">—</div></div>
    <div class="card"><div class="label">FPS</div><div id="mFps" class="val">—</div></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
